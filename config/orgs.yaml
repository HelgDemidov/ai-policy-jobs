# Организации, подключённые к ATS-коннекторам (org-centric: fetch(slug) для
# ОДНОЙ известной организации). Комплементарное query-centric семейство —
# searches.yaml (fetch(spec) по поисковому запросу — организации и вакансии
# приходят из самих данных, а не из заранее известного списка, как здесь).
# Оба семейства пишут в одну и ту же таблицу postings, кросс-source дедуп —
# по dedup_key (scripts/store.py).
#
# Чтобы добавить новую организацию: найти её ATS-слаг — обычно виден в
# футере/ссылке «powered by» на карьерной странице, либо угадывается и
# проверяется так:
#   curl -s -o /dev/null -w "%{http_code}\n" https://api.lever.co/v0/postings/<slug>?mode=json
#   curl -s -o /dev/null -w "%{http_code}\n" https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   curl -s -o /dev/null -w "%{http_code}\n" https://<slug>.jobs.personio.com/xml
# Всегда проверять, что вернувшийся контент — действительно нужная
# организация, прежде чем доверять коду 200: короткие/общие слаги могут
# случайно совпасть с посторонней компанией (так вышло с «iai» на
# Greenhouse на первом проходе — британская tech-фирма, не Istituto Affari
# Internazionali).
#
# Первичный проход по ~24 think tank'ам Tier A/B (2026-07-25) нашёл только
# ECFR/Personio на брендах Lever/Greenhouse/Ashby/Personio — остальные
# показались «кастомными». Повторная проверка 2026-08-21 (ресёрч под
# docs/tech_specs/point-source-connectors/spec.md) нашла: многие из них на
# деле — узнаваемые платформы, просто другие: SmartRecruiters, Teamtailor,
# Workable, Pinpoint (публичный JSON), iCIMS/JazzHR (server-rendered HTML,
# iCIMS дополнительно за AWS WAF — см. scripts/browser_resolver.py). Слаги:
#   curl -s "https://api.smartrecruiters.com/v1/companies/<slug>/postings?limit=1"
#   curl -s "https://<careers-домен>/jobs.json"                    # Teamtailor
#   curl -s "https://apply.workable.com/api/v1/widget/accounts/<slug>?full=true"
#   curl -s "https://<careers-домен>/postings.json"                # Pinpoint
#   curl -s "https://<slug>.icims.com/jobs/search?ss=1" -H "User-Agent: ..."   # 405 без браузера — это нормально, см. spec §1
#   curl -s "https://<slug>.applytojob.com/apply" -H "User-Agent: ..."         # JazzHR
# Полная выборка кандидатов на будущий донабор —
# docs/think-tank-io-source-sweep/notes.md.
#
# ats: html_scrape — bespoke-хвост без общей платформы, записи используют
# `url` (+ опционально `list_selector`) вместо `slug`, см.
# scripts/connectors/ats/html_scrape.py.
#
# tier — как в исходном шортлисте: A = remote/Черногория-Сербия,
# B = Западная Европа, C = США/Япония.

