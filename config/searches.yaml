# Query-centric search specs — organizations and postings come from the data
# itself, not a pre-known org list (contrast with orgs.yaml).
#
# `manual: true` — spec runs only with `scripts/run.py --linkedin`. The mechanism
# is live but currently unused: LinkedIn was gated this way until 2026-07-25, then
# un-gated once it turned out to cost ~2-3 requests per run (unauthenticated
# search, `linkedin_fetch_description` off) while being the highest-precision
# source. Do NOT set `fetch_description: true` on the LinkedIn spec — that adds
# one request per posting (~20x per run) and is where the rate-limit risk actually
# lives. See docs/backlog/BACKLOG.md and docs/job-aggregator-landscape/notes.md.
#
# Query phrasing is NOT interchangeable across sources — what works on one
# (e.g. Adzuna's `think tank`) may be noise on another. See
# docs/job-aggregator-landscape/notes.md for the live-tested query lessons behind
# each entry below before adding new ones by guesswork.

- id: himalayas-policy
  source: himalayas
  query: policy

- id: himalayas-ai-governance
  source: himalayas
  query: AI governance

- id: adzuna-thinktank-gb
  source: adzuna
  phrase: think tank
  country: gb

- id: adzuna-thinktank-be
  source: adzuna
  phrase: think tank
  country: be

- id: jobspy-linkedin-uk
  source: jobspy_linkedin
  query: AI policy analyst
  location: United Kingdom

- id: jobspy-indeed-uk
  source: jobspy_indeed
  query: '"AI policy" OR "AI governance"'
  location: United Kingdom
  country_indeed: UK
