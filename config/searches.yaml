# Query-centric поисковые спеки — организации и вакансии приходят из самих
# данных, а не из заранее известного списка организаций (в отличие от
# orgs.yaml).
#
# `manual: true` — спек запускается только с `scripts/run.py --linkedin`.
# Механизм рабочий, но сейчас не задействован ни для одного спека: LinkedIn
# был под этим гейтом до 2026-07-25, затем гейт снят — обращение стоит всего
# ~2-3 запроса на прогон (поиск без авторизации, `linkedin_fetch_description`
# выключен), при этом источник самый точный по попаданиям. НЕ включать
# `fetch_description: true` на LinkedIn-спеке — это добавляет отдельный
# запрос на каждую вакансию (~×20 за прогон), и именно здесь реальный риск
# рейт-лимита. См. docs/backlog/BACKLOG.md и
# docs/job-aggregator-landscape/notes.md.
#
# Формулировка запроса НЕ взаимозаменяема между источниками — то, что
# работает на одном (например, `think tank` на Adzuna), может оказаться
# шумом на другом. Живые уроки по каждой записи ниже — в
# docs/job-aggregator-landscape/notes.md; перед добавлением новых запросов
# наугад стоит свериться с ними.

- id: adzuna-thinktank-gb
  source: adzuna
  phrase: think tank
  country: gb

- id: adzuna-thinktank-be
  source: adzuna
  phrase: think tank
  country: be

- id: jobspy-linkedin-uk
  source: jobspy_linkedin
  query: AI policy analyst
  location: United Kingdom

# un_secretariat — один публичный JSON-фид на весь UN Secretariat (см.
# scripts/connectors/query/un_secretariat.py), не одна организация на
# запись, как остальные ATS-коннекторы в orgs.yaml — поэтому здесь, не там.
# dept_allowlist — точные значения поля dept.name. Первые два подтверждены
# живьём 2026-08-21 (реальные записи в фиде на тот момент). Последние два
# (UNICRI/UNODET) — НЕ подтверждены: у обоих 0 вакансий на момент проверки,
# поэтому их точное dept.name в фиде не наблюдалось — лучшее предположение
# по официальному названию, сверить, когда появится живая вакансия.
- id: un-secretariat
  source: un_secretariat
  dept_allowlist:
    - "Office for Disarmament Affairs"
    - "United Nations Conference on Trade and Development"
    - "United Nations Interregional Crime and Justice Research Institute"
    - "Office for Digital and Emerging Technologies"
