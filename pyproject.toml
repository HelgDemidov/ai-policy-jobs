[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a real Postgres (DATABASE_URL) — run via the test-integration CI job or manually, never part of the default suite",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Alembic-autogenerated — regenerated wholesale, not hand-reformatted;
# same exclusion scopus_search_code's reference pyproject.toml applies.
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
